spring.application.name=HOTEL-SERVICES
# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/new_microservice
spring.datasource.username=postgres
spring.datasource.password=123Akash

# Hibernate Dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA Hibernate Auto DDL
spring.jpa.hibernate.ddl-auto=update

# Show SQL statements
spring.jpa.show-sql=true

# Format SQL statements
spring.jpa.properties.hibernate.format_sql=true
server.port=8091

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8093/eureka

